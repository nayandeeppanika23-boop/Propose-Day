<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg, #ffe4ec, #fff1e6);
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.page.active {
  display: flex;
}

/* ---------- BEARS ---------- */
.bears {
  display: flex;
  gap: 20px;
  margin-bottom: 30px;
}

.bear {
  width: 90px;
  height: 110px;
  background: #fff;
  border-radius: 50% 50% 45% 45%;
  position: relative;
  animation: cuddle 2.5s ease-in-out infinite;
}

.bear::before,
.bear::after {
  content: '';
  position: absolute;
  top: -15px;
  width: 30px;
  height: 30px;
  background: #fff;
  border-radius: 50%;
}

.bear::before { left: 5px; }
.bear::after { right: 5px; }

@keyframes cuddle {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(5px) rotate(1deg); }
}

/* ---------- HEARTS ---------- */
.heart {
  position: absolute;
  color: #ff6b9c;
  font-size: 18px;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh) scale(0.6); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}

/* ---------- TEXT ---------- */
.cursive {
  font-family: 'Great Vibes', cursive;
  color: #ff5c8a;
}

.question {
  font-size: 40px;
  margin-bottom: 20px;
}

/* ---------- BUTTONS ---------- */
.buttons {
  display: flex;
  gap: 25px;
  margin-top: 20px;
}

button {
  padding: 12px 28px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

#yes {
  background: #ff5c8a;
  color: #fff;
}

#no {
  background: #ffd1dc;
  color: #a9445b;
  position: relative;
}

/* ---------- PROPOSAL PAGE ---------- */
.message {
  max-width: 700px;
  font-size: 30px;
  line-height: 1.5;
  animation: glow 3s ease-in-out infinite;
}

@keyframes glow {
  0%,100% { text-shadow: 0 0 5px #ffb6c1; }
  50% { text-shadow: 0 0 15px #ff7aa8; }
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
  <div class="bears">
    <div class="bear"></div>
    <div class="bear"></div>
  </div>

  <div class="question cursive">Will you be mine?</div>

  <div class="buttons">
    <button id="no">No</button>
    <button id="yes">Yes</button>
  </div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <div class="message cursive">
    Hey bubbu... you know..<br><br>
    You are my life's sabse behtareen and most beautiful accident ho..<br>
    jiske liye main humesha grateful rahunga...<br><br>
    I love you.. I love you bohot bohot bohooooooooot jyaada..<br><br>
    One thing I wanna ask you —<br><br>
    Will you.. Will you marry me..?!!<br><br>
    <span style="font-size:40px;">My HEART 💕</span>
  </div>
</div>

<script>
/* Floating hearts */
function createHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerText = '💕';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.animationDuration = (4 + Math.random() * 4) + 's';
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}
setInterval(createHeart, 500);

/* No button runs away */
const noBtn = document.getElementById('no');
noBtn.addEventListener('mouseover', moveNo);
noBtn.addEventListener('click', moveNo);

function moveNo() {
  noBtn.style.transform = `translate(${Math.random()*200-100}px, ${Math.random()*200-100}px)`;
}

/* Yes button */
document.getElementById('yes').onclick = () => {
  document.getElementById('page1').classList.remove('active');
  document.getElementById('page2').classList.add('active');
};
</script>

</body>
</html>
